name: Mitarbeiter FX63 NEU APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Mitarbeiter FX63 NEU entpacken
        run: |
          unzip -o "Karsak-Stundenzettel-MITARBEITER-FX63-NEU.zip" -d appsource
          ls -la appsource/karsak-stundenzettel-android

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Mitarbeiter APK bauen
        working-directory: appsource/karsak-stundenzettel-android
        run: gradle assembleDebug

      - name: Mitarbeiter APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-MITARBEITER-FX63-NEU
          path: appsource/karsak-stundenzettel-android/app/build/outputs/apk/debug/app-debug.apk
