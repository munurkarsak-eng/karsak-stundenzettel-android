name: Stundenzettel Mitarbeiter FX63 bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Mitarbeiter FX64 entpacken
        run: |
          rm -rf appsource
          mkdir -p appsource
          unzip -o karsak-stundenzettel-MITARBEITER-FX63.zip -d appsource
          echo "=== Inhalt ==="
          find appsource -maxdepth 3 -type f | sort

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK erstellen
        working-directory: appsource/karsak-stundenzettel-android
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-MITARBEITER-FX63
          path: appsource/karsak-stundenzettel-android/app/build/outputs/apk/debug/app-debug.apk
