name: FX66 SUPABASE APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: FX66 entpacken
        run: |
          rm -rf fx66build
          mkdir -p fx66build
          unzip -o "Karsak-Stundenzettel-MITARBEITER-FX66-SUPABASE-FIX.zip" -d fx66build
          echo "=== Inhalt ==="
          find fx66build -maxdepth 3 -type f | head -50

      - name: FX66 APK bauen
        run: |
          cd fx66build
          PROJECT_DIR="$(find . -name settings.gradle.kts -printf '%h\n' | head -1)"
          echo "Projektordner: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-MITARBEITER-FX66
          path: fx66build/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
