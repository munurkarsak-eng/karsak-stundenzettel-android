name: FX65 SUPABASE APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: FX65 entpacken
        run: |
          rm -rf fx65build
          mkdir -p fx65build
          unzip -o "Karsak-Stundenzettel-MITARBEITER-FX65-SUPABASE-FIX.zip" -d fx65build
          echo "=== Inhalt ==="
          find fx65build -maxdepth 3 -type f | sort

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: FX65 APK bauen
        working-directory: fx65build/fx65work
        run: gradle assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-FX65
          path: fx65build/fx65work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
