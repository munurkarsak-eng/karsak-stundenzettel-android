name: Stundenzettel APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: FX15 entpacken
        run: unzip -o karsak-stundenzettel-android-FX25.zip

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK erstellen
        working-directory: karsak-stundenzettel-android
        run: gradle assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-FX15
          path: karsak-stundenzettel-android/app/build/outputs/apk/debug/app-debug.apk
