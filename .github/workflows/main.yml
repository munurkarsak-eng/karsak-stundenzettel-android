name: FX71 MITARBEITER APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: FX71 entpacken
        run: |
          rm -rf fx71build
          mkdir -p fx71build
          unzip -o "Karsak-Stundenzettel-MITARBEITER-FX71-EMPFANG-SYNCHRONISIEREN.zip" -d fx71build

      - name: FX71 APK bauen
        run: |
          cd fx71build
          PROJECT_DIR="$(find . -name settings.gradle.kts -printf '%h\n' | head -1)"
          echo "Projektordner: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-MITARBEITER-FX71
          path: fx71build/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
