name: Mitarbeiter FX63 SUPABASE APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Supabase Mitarbeiter-App entpacken
        run: |
          rm -rf appsource
          mkdir -p appsource
          unzip -o "Karsak-Stundenzettel-MITARBEITER-FX64-SUPABASE.zip" -d appsource
          ls -la appsource/karsak-stundenzettel-android

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Supabase APK bauen
        working-directory: appsource/karsak-stundenzettel-android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: gradle assembleDebug

      - name: Supabase APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-MITARBEITER-FX63-SUPABASE
          path: appsource/karsak-stundenzettel-android/app/build/outputs/apk/debug/app-debug.apk
