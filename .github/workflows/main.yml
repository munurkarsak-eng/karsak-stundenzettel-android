name: FX64 SUPABASE APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: FX64 entpacken
        run: |
          rm -rf fx64build
          mkdir fx64build
          unzip -o "Karsak-Stundenzettel-MITARBEITER-FX64-SUPABASE-FINAL.zip" -d fx64build

      - name: FX64 APK bauen
        working-directory: fx64build/fx64final
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-FX64
          path: fx64build/fx64final/app/build/outputs/apk/debug/app-debug.apk
