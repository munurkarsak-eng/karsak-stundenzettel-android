name: Stundenzettel APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dateien laden
        uses: actions/checkout@v4

      - name: Mitarbeiter FX63 entpacken
        run: |
          unzip -o karsak-stundenzettel-MITARBEITER-FX63.zip -d appsource

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle ausführbar machen
        run: chmod +x appsource/gradlew

      - name: APK bauen
        working-directory: appsource
        run: ./gradlew assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel
          path: appsource/app/build/outputs/apk/debug/app-debug.apk
