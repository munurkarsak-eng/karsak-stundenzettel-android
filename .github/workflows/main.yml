name: FX64 SUPABASE APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: FX64 entpacken und APK bauen
        run: |
          mkdir -p fx64build
          unzip -o "Karsak-Stundenzettel-MITARBEITER-FX64-SUPABASE-FINAL.zip" -d fx64build

          GRADLEW=$(find fx64build -name gradlew -type f | head -n 1)
          ROOT=$(dirname "$GRADLEW")

          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug

          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          cp "$APK" "$GITHUB_WORKSPACE/Karsak-Stundenzettel-FX64.apk"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Stundenzettel-FX64
          path: Karsak-Stundenzettel-FX64.apk
